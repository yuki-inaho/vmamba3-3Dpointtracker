name: ONNX CPU validation
on:
  push:
    branches: [work/onnx-best200-20261001]
    paths: ['.github/workflows/onnx-cpu-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-baseline-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Fetch the pinned native library
        run: git submodule update --init --recursive third_party/visionMamba3
      - name: Verify locked baseline environment
        run: |
          mkdir -p quality-evidence
          uv sync --locked --extra onnx --python 3.12
          uv lock --check > quality-evidence/uv-lock-check.txt 2>&1
          uv run --locked --extra onnx pytest -q > quality-evidence/pytest.txt 2>&1
          uv run --locked --extra onnx ty check > quality-evidence/ty.txt 2>&1
          uv run --locked --extra onnx python -c 'import sys, torch, numpy; print(sys.version); print(torch.__version__); print(numpy.__version__)' > quality-evidence/versions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locked-baseline-quality
          path: quality-evidence/
          retention-days: 7
          if-no-files-found: warn
  prepare-native-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned source and offline wheels
        run: |
          mkdir -p native-import-dependencies/wheels
          git submodule update --init --recursive third_party/visionMamba3
          tar --exclude=.git -czf native-import-dependencies/visionmamba3-upstream.tgz -C third_party visionMamba3
          python -m pip download --no-deps --only-binary=:all: --dest native-import-dependencies/wheels ruff==0.15.20 triton==3.7.1
          find native-import-dependencies -type f -print0 | sort -z | xargs -0 sha256sum > native-import-dependencies/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-import-dependencies
          path: native-import-dependencies/
          retention-days: 7
          if-no-files-found: error
