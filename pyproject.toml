[project]
name = "vmamba3-3dpointtracker"
version = "0.1.0"
description = "3D point tracker: SEA-RAFT + DA3 depth + Mamba-3 SSM refiner"
authors = [{ name = "Masahiro Ogawa" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "visionmamba3",
    "torch==2.12.1",
    "torchvision==0.27.1",
    "einops",
    "numpy<2",
    "pillow",
    "opencv-python",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "requests",
    "tqdm",
    "omegaconf",
    "addict",
    "safetensors",
    "huggingface-hub",
    "imageio",
    "moviepy>=2.2.1",
    "transformers>=5.6.2",
    "plotly>=6.7.0",
    "h5py>=3.16.0",
    "plyfile>=1.1.3",
    "evo>=1.36.3",
    "pycolmap>=4.0.3",
    "schedulefree>=1.4.1",
    "open3d>=0.19.0",
    "trimesh>=4.12.2",
    "pycocotools",
    "py7zr",
    "timm>=1.0.28",
    "tensorboard>=2.21.0",
    "beartype>=0.22.9",
    "jaxtyping>=0.3.11",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.19",
    "onnxruntime>=1.23",
    "onnxscript>=0.5",
]

[tool.uv.sources]
visionmamba3 = { path = "third_party/visionMamba3", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mamba3_tracker", "src/searaft_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.src]
# Incremental coverage for the staged training/cache/profiling path.
include = [
    "src/mamba3_tracker/train/profiling.py",
    "src/mamba3_tracker/data/frozen_cache.py",
    "src/mamba3_tracker/data/synthetic.py",
    "src/mamba3_tracker/data/fixed_da.py",
    "src/mamba3_tracker/model/dino_encoder.py",
    "src/mamba3_tracker/model/onnx_refiner.py",
    "src/mamba3_tracker/deployment",
    "scripts/run_refiner_onnx.py",
    "scripts/verify_refiner_cpp.py",
    "scripts/validate_refiner_cpu.py",
    "scripts/export_refiner_onnx.py",
    "scripts/eval_onnx_refiner.py",
    "scripts/smoke_train_synthetic.py",
    "scripts/train_v64_staged.py",
    "tests/unit/test_profile_cache.py",
]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings are runtime metadata, not Python forward references.
"src/mamba3_tracker/train/profiling.py" = ["F722"]
"src/mamba3_tracker/data/fixed_da.py" = ["F722"]
"src/mamba3_tracker/model/onnx_refiner.py" = ["F722"]
"src/mamba3_tracker/deployment/runtime.py" = ["F722"]

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-xdist",
    "ruff>=0.15.14",
    "ty>=0.0.84",
]

[tool.uv]
# Keep the CUDA stack used by the synthetic refiner/head GPU smoke and DA3 probe.
# This complete cuDNN wheel supplies tensor_ir and runtime_compiled engines.
# Source scripts/cudnn_env.sh to select its libraries and matching CUDA/NVRTC
# rather than mixing components with the host cuDNN installation.
override-dependencies = ["nvidia-cudnn-cu13==9.26.0.51"]
