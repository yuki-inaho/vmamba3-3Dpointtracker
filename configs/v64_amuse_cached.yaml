# Fast training recipe: photometric augmentation disabled to reuse frozen frame/flow tensors.
# Architecture, depth resolution, warmup and optimizer are unchanged; cache values are lossless.
version: v35
model:
  two_pool: true
  dim: 128
  state_dim: 64
  num_heads: 4
  num_layers: 2
  max_log_correction: 2.0
  max_delta_uv: 2.0
  patch_size: 5
  d_proj: 64
  dino_model: facebook/dinov3-vits16-pretrain-lvd1689m
  dino_image_size: 448
  image_size: 896
flow:
  source: waft_live
  scale: -1
  url: MemorySlices/Tartan-C-T-TSKH-spring540x960-M
  cfg: third_party/SEA-RAFT/config/eval/spring-M.json
  iters: 4
  fb_alpha: 0.05
  fb_beta: 1.0
data:
  reanchor_window: false
  subsets:
  - pstudio
  - drivetrack
  - adt
  image_size: 896
  num_tracks: 256
  da3_depth_root: ~/data/tapvid3d_da3
  split:
    source: official
    n_val_monitor: 15
    seed: 42
    train_manifest: temp/tapvid3d_train_subset_manifest.json
    growing: true
    val_per_subset: 5
    refresh_steps: 5
  photometric_augment: false
train:
  out_dir: result/v64_amuse_cached
  steps: 20000
  warmup: 500
  decay: 2000
  ckpt_every: 50
  val_every: 500
  log_every: 5
  lr: 0.0003
  weight_decay: 0.05
  grad_clip: 1.0
  batch: 1
  window: 8
  amp: bf16
  num_workers: 0
  cpu_threads: 8
  seed: 0
  optimizer: amuse
  checkpoint_k: 3
  early_stop_patience: 5
  early_stop_min_delta: 0.001
  amuse:
    muon_lr: 0.02
    aux_lr: 0.0003
    beta1: 0.8
    rho: 0.3
    aux_update_type: adamw
  val_clips: 15
loss:
  weights:
    pos_3D: 1.0
    reg_uv: 0.1
frozen_cache:
  enabled: true
  root: ~/data/tapvid3d_frozen_cache
  dino_gb: 2
  flow_gb: 4
  flow_batch: 4
  flow_max_batch: 8
  dino_batch: 32
  gpu_reserve_gb: 8
