# AMUSE initial LR candidates; tune only on held-out training clips.
model:
  dim: 64
  state_dim: 64
  num_heads: 4
  num_layers: 2
  bidirectional: true
data:
  cache_dir: ~/data/tapvid3d_flowvis
  subsets:
  - adt
  - drivetrack
  - pstudio
  num_points: 256
  max_frames: 300
  clip_cache: 512
train:
  out_dir: result/v94_amuse
  steps: 3000
  lr: 0.001
  warmup: 100
  decay: 600
  grad_clip: 1.0
  pos_weight: auto
  log_every: 50
  val_every: 250
  ckpt_every: 250
  seed: 42
  optimizer: amuse
  checkpoint_k: 3
  early_stop_patience: 5
  early_stop_min_delta: 0.001
  amuse:
    muon_lr: 0.02
    aux_lr: 0.001
    beta1: 0.8
    rho: 0.3
    aux_update_type: adamw
